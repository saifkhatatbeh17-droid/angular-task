<div class="cart-card">
  <p class="eyebrow">SHOPPING CART</p>
  <p>Product: <strong>{{ productName || 'No product selected' }}</strong></p>
  <p>Unit Price: <strong>${{ productPrice }}</strong></p>
  <p>Quantity: <strong>{{ quantity }}</strong></p>
  <hr />
  <p class="total">Total Price: <strong>${{ totalPrice }}</strong></p>
</div>
